<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GovFlow AI — Atendimento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-deep: #1e3d1a;
    --green-forest: #2d5a27;
    --green-mid: #3d7a35;
    --green-light: #5a9e50;
    --green-mist: #dcefd9;
    --beige: #f5f5dc;
    --white: #ffffff;
    --ink: #111a0f;
    --ink-soft: #6b7c68;
    --border: #d0dccb;
    --error: #c0392b;
    --warn: #d4a017;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Syne', sans-serif;
    background: var(--beige);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--green-forest);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1rem; font-weight: 700; }
  header .sub { font-size: 0.7rem; opacity: 0.85; font-weight: 500; }
  header a {
    color: white;
    font-size: 0.72rem;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.5);
    padding: 5px 10px;
    border-radius: 100px;
  }
  header a:hover { background: rgba(255,255,255,0.15); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.86rem;
    line-height: 1.5;
    white-space: pre-wrap;
    animation: in 0.2s ease;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .bot {
    align-self: flex-start;
    background: var(--white);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }
  .user {
    align-self: flex-end;
    background: var(--green-forest);
    color: white;
    border-bottom-right-radius: 2px;
  }
  .bot.sucesso { border-color: var(--green-light); background: var(--green-mist); }
  .bot.erro { border-color: var(--error); background: #fdecea; color: var(--error); }
  .bot.warn { border-color: var(--warn); }

  .quick-replies { display: flex; gap: 8px; flex-wrap: wrap; align-self: flex-start; }
  .quick-replies button {
    background: var(--white);
    border: 1.5px solid var(--green-forest);
    color: var(--green-forest);
    padding: 6px 14px;
    border-radius: 100px;
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .quick-replies button:hover { background: var(--green-mist); }

  #input-bar {
    border-top: 1px solid var(--border);
    background: var(--white);
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    align-items: center;
  }
  #texto {
    flex: 1;
    padding: 10px 14px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    font-family: 'Syne', sans-serif;
    font-size: 0.86rem;
    outline: none;
  }
  #texto:focus { border-color: var(--green-forest); }
  #input-bar button, #input-bar label {
    background: var(--green-forest);
    color: white;
    border: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  #input-bar button:hover, #input-bar label:hover { background: var(--green-deep); }
  #arquivo-input { display: none; }
  #arquivo-nome { font-size: 0.7rem; color: var(--ink-soft); text-align: center; padding: 0 20px 4px; max-width: 720px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>

<header>
  <div>
    <h1>GovFlow AI</h1>
    <div class="sub">Atendimento via Webchat</div>
  </div>
  <a href="/page.html">Painel de Gestão →</a>
</header>

<div id="chat"></div>
<div id="arquivo-nome"></div>
<div id="input-bar">
  <label for="arquivo-input" title="Enviar documento">📎</label>
  <input type="file" id="arquivo-input" accept=".pdf,.jpg,.jpeg,.png" />
  <input type="text" id="texto" placeholder="Digite sua mensagem..." autocomplete="off" />
  <button id="enviar" title="Enviar">➤</button>
</div>

<script>
  const usuarioId = obterUsuarioId();
  const chat = document.getElementById('chat');

  function obterUsuarioId() {
    let id = localStorage.getItem('govflow_usuario_id');
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem('govflow_usuario_id', id);
    }
    return id;
  }

  function addBubble(texto, autor, tipo) {
    const el = document.createElement('div');
    el.className = `bubble ${autor}${tipo ? ' ' + tipo : ''}`;
    el.textContent = texto;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function addQuickReplies() {
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';
    ['1', '2'].forEach(opcao => {
      const btn = document.createElement('button');
      btn.textContent = opcao === '1' ? '1 · Abertura Redesim' : '2 · Consulta e-CAC';
      btn.onclick = () => enviarTexto(opcao);
      wrap.appendChild(btn);
    });
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  async function bootstrap() {
    const res = await fetch(`/hub/sessao/${usuarioId}`);
    const data = await res.json();
    data.mensagens.forEach(m => addBubble(m, 'bot'));
    if (data.estado === 'aguardando_servico') addQuickReplies();
  }

  async function enviarTexto(conteudo) {
    addBubble(conteudo, 'user');
    const res = await fetch('/hub/mensagens', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario_id: usuarioId, tipo: 'texto', conteudo }),
    });
    const data = await res.json();
    data.mensagens.forEach(m => addBubble(m, 'bot'));
    if (data.estado === 'aguardando_servico') addQuickReplies();
  }

  async function enviarArquivo(file) {
    addBubble(`📎 ${file.name}`, 'user');
    const form = new FormData();
    form.append('usuario_id', usuarioId);
    form.append('arquivo', file);

    const res = await fetch('/hub/arquivos', { method: 'POST', body: form });
    const data = await res.json();
    data.mensagens.forEach(m => addBubble(m, 'bot', res.ok ? null : 'erro'));
  }

  function iniciarStream() {
    const es = new EventSource(`/hub/eventos/${usuarioId}/stream`);
    es.onmessage = (event) => {
      const evento = JSON.parse(event.data);
      addBubble(evento.texto, 'bot', evento.tipo === 'erro' ? 'erro' : evento.tipo === 'sucesso' ? 'sucesso' : null);
    };
  }

  document.getElementById('enviar').onclick = () => {
    const input = document.getElementById('texto');
    const valor = input.value.trim();
    if (!valor) return;
    input.value = '';
    enviarTexto(valor);
  };

  document.getElementById('texto').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('enviar').click();
  });

  document.getElementById('arquivo-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) enviarArquivo(file);
    e.target.value = '';
  });

  bootstrap();
  iniciarStream();
</script>
</body>
</html>
